name: Build portable R

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build R ${{ matrix.r-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.6.1", "4.5.3", "4.4.3"]

    env:
      R_VERSION: ${{ matrix.r-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable R
        id: build
        shell: pwsh
        run: .\Build-PortableR.ps1 -RVersion $env:R_VERSION

      - name: Get short SHA
        id: vars
        shell: pwsh
        run: |
          "short_sha=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: R-portable-${{ matrix.r-version }}-${{ steps.vars.outputs.short_sha }}
          path: .\R-portable-${{ matrix.r-version }}-*-x64.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: windows-latest

    steps:
      - name: Get short SHA
        id: vars
        shell: pwsh
        run: |
          "short_sha=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT

      - name: Download all version archives
        uses: actions/download-artifact@v4
        with:
          pattern: R-portable-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ steps.vars.outputs.short_sha }}
          name: Portable R (${{ steps.vars.outputs.short_sha }})
          make_latest: true
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true