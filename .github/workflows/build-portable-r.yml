name: Build portable R

on:
  push:
    branches:
      - release
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build R ${{ matrix.r-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.6.1", "4.5.3", "4.4.3"]
    env:
      R_VERSION: ${{ matrix.r-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable R
        id: build
        shell: pwsh
        run: .\Build-PortableR.ps1 -RVersion $env:R_VERSION

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: R-portable-${{ matrix.r-version }}-${{ steps.build.outputs.short_sha }}
          path: .\R-portable-${{ matrix.r-version }}-*-x64.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    # alway() prevents downstream skip cascades. 
    # needs.build.result guarantees the matrix ran successfully.
    # github.ref_type == 'tag' accurately verifies if it was a tag trigger.
    if: always() && needs.build.result == 'success' && github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - name: Download all version archives
        uses: actions/download-artifact@v4
        with:
          pattern: R-portable-*
          path: release-assets
          merge-multiple: true

      - name: Attach archives to the pushed tag's GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
